<script>
function setTheme(theme, remember) {
  document.documentElement.setAttribute("data-theme", theme);
  if (remember !== false) { try { localStorage.setItem("ef-theme", theme); } catch (e) {} }
}
var saved = null;
try { saved = localStorage.getItem("ef-theme"); } catch (e) {}
var media = window.matchMedia("(prefers-color-scheme: dark)");
if (saved) { setTheme(saved, false); }                       // user's saved choice
else { setTheme(media.matches ? "dark" : "light", false); }  // system preference fallback
media.addEventListener("change", function (e) {
  var s = null;
  try { s = localStorage.getItem("ef-theme"); } catch (x) {}
  if (!s) { setTheme(e.matches ? "dark" : "light", false); }
});
</script>
